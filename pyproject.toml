[project]
name = "data-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.19.1",
    "asyncpg>=0.29.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["agents", "agentschemas", "utils", "api", "config"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
